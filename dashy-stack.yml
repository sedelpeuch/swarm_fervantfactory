version: '3.8'

services:
  dashy:
    image: lissy93/dashy:latest
    volumes:
      - dashy_data:/app/public/data
      - ./conf.yml:/app/user-data/conf.yml
      - ./theme.css:/app/user-data/theme.css
    ports:
      - "1313:8080"
    environment:
      - CONF_HASH=cd15f8d62a7ee5ad36a1d9774433ab88444ae235ac812983bcb6dd16e4e9259a
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 360s
        order: start-first
        failure_action: rollback
        monitor: 120s  # Surveille pendant 2 minutes après le déploiement
      rollback_config:
        parallelism: 1
        delay: 360s
        order: start-first
        failure_action: pause
      labels:
        - traefik.enable=true
        - traefik.http.routers.dashy.rule=Host(`dashy.fervantfactory.delpeuch.net`)
        - traefik.http.routers.dashy.entrypoints=web
        - traefik.http.services.dashy.loadbalancer.server.port=8080
    networks:
      - proxy

volumes:
  dashy_data:

networks:
  proxy:
    external: true
