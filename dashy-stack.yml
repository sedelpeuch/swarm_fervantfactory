version: '3.8'

services:
  dashy:
    image: lissy93/dashy:latest
    volumes:
      - dashy_data:/app/public/data
      - ./conf.yml:/app/user-data/conf.yml
      - ./theme.css:/app/user-data/theme.css
    ports:
      - "1313:8080"
    environment:
      - CONF_HASH=3f0ec97e8c2226e14316235d4fd9e0f1df6906b25e53f2732b0437fdd867ae17
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 360s
        order: start-first
        failure_action: rollback
        monitor: 120s  # Surveille pendant 2 minutes après le déploiement
      rollback_config:
        parallelism: 1
        delay: 360s
        order: start-first
        failure_action: pause
      labels:
        - traefik.enable=true
        - traefik.http.routers.dashy.rule=Host(`dashy.fervantfactory.delpeuch.net`)
        - traefik.http.routers.dashy.entrypoints=websecure
        - traefik.http.routers.dashy.tls.certresolver=gandi
        - traefik.http.services.dashy.loadbalancer.server.port=8080
    networks:
      - proxy

volumes:
  dashy_data:

networks:
  proxy:
    external: true
