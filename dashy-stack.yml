version: '3.8'

services:
  dashy:
    image: lissy93/dashy:latest
    volumes:
      - dashy_data:/app/public/data
      - ./conf.yml:/app/user-data/conf.yml
    ports:
      - "1313:8080"
    environment:
      - CONF_HASH=0d478da3354c76a3d74bb90bb0fda3425bb6dd731f6b9e09b0558a2db4b5ddd8
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 360s
        order: start-first
        failure_action: rollback
        monitor: 120s  # Surveille pendant 2 minutes après le déploiement
      rollback_config:
        parallelism: 1
        delay: 360s
        order: start-first
        failure_action: pause
    networks:
      - proxy

volumes:
  dashy_data:

networks:
  proxy:
    external: true
