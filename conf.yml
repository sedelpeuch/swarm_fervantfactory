pageInfo:
  title: FervantFactory
  description: Salle de contrôle homelab
  navLinks: []
appConfig:
  theme: fervantfactory
  externalStyleSheet: ['/theme.css']
  layout: auto
  language: fr
  startingView: default
  statusCheck: true
  defaultOpeningMethod: newtab
  routingMode: hash
  hideComponents:
    hideHeading: false
    hideNav: true
    hideSearch: true
    hideSettings: false
    hideFooter: true
  iconSize: large
  statusCheckInterval: 300
  faviconApi: allesedv
  enableMultiTasking: false
  widgetsAlwaysUseProxy: false
  webSearch:
    disableWebSearch: false
    searchEngine: duckduckgo
    openingMethod: newtab
    searchBangs: {}
  enableFontAwesome: true
  enableMaterialDesignIcons: true
  auth:
    enableGuestAccess: false
    users: []
    enableOidc: false
    oidc: {}
    enableHeaderAuth: false
    headerAuth:
      userHeader: REMOTE_USER
      proxyWhitelist: []
    enableKeycloak: false
  showSplashScreen: false
  preventWriteToDisk: false
  preventLocalSave: false
  disableConfiguration: false
  disableConfigurationForNonAdmin: false
  allowConfigEdit: true
  enableServiceWorker: false
  disableContextMenu: false
  disableUpdateChecks: false
  disableSmartSort: false
  enableErrorReporting: false
  colCount: 3
sections:
  - name: Domotique
    displayData:
      sortBy: alphabetical
      collapsed: false
      hideForGuests: false
      rows: 1
      cols: 1
      cutToHeight: true
      color: 'rgba(212,146,63,0.14)'
    items:
      - title: Home Assistant
        description: Home automation platform
        icon: fas fa-house
        url: http://192.168.1.29:8123/
        id: 0_2001_homeassistant
      - title: n8n
        description: Workflow automation
        icon: fas fa-project-diagram
