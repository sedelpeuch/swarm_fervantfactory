version: '3.8'

services:
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    ports:
      - "3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    environment:
      - TZ=Europe/Paris
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        - traefik.http.routers.kuma.rule=Host(`kuma.fervantfactory.delpeuch.net`)
        - traefik.http.routers.kuma.entrypoints=web
        - traefik.http.services.kuma.loadbalancer.server.port=3001
    networks:
      - proxy

volumes:
  uptime_kuma_data:
    driver: local

networks:
  proxy:
    external: true
