version: '3.8'

services:
  dashy:
    image: lissy93/dashy:latest
    volumes:
      - dashy_data:/app/public/data
      - ./conf.yml:/app/user-data/conf.yml
    ports:
      - "1313:8080"
    environment:
      - CONF_HASH=d29a8312f47ed5b8a62ff623f38cbe82bd4f8529927afae99b5ca1a2c7f8d51e
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 360s
        order: start-first
        failure_action: rollback
        monitor: 120s  # Surveille pendant 2 minutes après le déploiement
      rollback_config:
        parallelism: 1
        delay: 360s
        order: start-first
        failure_action: pause
    networks:
      - proxy

volumes:
  dashy_data:

networks:
  proxy:
    external: true
